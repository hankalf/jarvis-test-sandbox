# Wall calendar display configuration.
# Copy to config.yaml and edit. Paths are resolved relative to this file.

timezone: America/New_York

server:
  host: 0.0.0.0
  port: 8080

# Read-only calendar feeds, polled on a timer.
#
# Google Calendar: Settings -> <calendar> -> "Secret address in iCal format".
#   Treat that URL as a password; anyone with it can read the calendar.
# iCloud: right-click the calendar -> Share Calendar -> Public Calendar,
#   then swap the leading `webcal://` for `https://` (or leave it, we rewrite it).
# Outlook/Office 365: Settings -> Calendar -> Shared calendars -> Publish, ICS link.
calendars:
  - name: Work
    color: "#5b9cf8"
    url: "https://calendar.google.com/calendar/ical/REPLACE_ME/basic.ics"
  - name: Medical
    color: "#f2884b"
    url: "https://p01-caldav.icloud.com/published/2/REPLACE_ME"

calendar_refresh_minutes: 15

display:
  # Mode the panel sits in when nobody is around: "photos" or "calendar".
  default_mode: photos
  # How long after the last presence ping before it drifts back to photos.
  idle_timeout_seconds: 90
  photo_dir: photos
  photo_interval_seconds: 45
  clock_24h: false
  week_starts_on: sunday
  # Days of agenda to render in the sidebar.
  agenda_days: 14
  quiet_hours:
    # When enabled, the panel blanks entirely between these times. Presence
    # still wakes it to the calendar, it just doesn't sit there glowing at 3am.
    enabled: false
    start: "23:00"
    end: "06:30"

# How the panel reads for the person standing in front of it. The defaults are
# tuned for an older viewer at a few feet: light theme, large type, plain words.
accessibility:
  # "light" or "dark". Light is the default on purpose -- thin light-on-dark
  # text haloes badly for aging eyes, especially after cataract surgery.
  theme: light
  # Multiplies every type size. 1.0 is already large; try 1.25 or 1.5 if they
  # squint, 0.85 if the panel is close to a chair.
  text_scale: 1.0
  # true  -> the big "what's next" screen (recommended)
  # false -> the denser two-column agenda
  simple_view: true
  # false hides the Week and Month buttons entirely, leaving one screen with
  # nothing to navigate and no way to get lost.
  show_week_month: true
  # Stops the slow photo pan and the crossfades. Worth trying if movement on
  # the wall is distracting or causes dizziness.
  reduce_motion: false
  # The day of the week in large type -- often the single most useful thing on
  # the panel for someone whose days run together.
  show_weekday_banner: true

# Checking on the display and adding photos from a phone.
remote:
  enabled: true
  # REQUIRED for any access from another device. Use a long random string:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(24))"
  # Empty means the remote page is refused from anywhere but the device itself.
  # The panel's own browser always works -- it connects over loopback.
  token: ""
  device_name: "Mom's Wall Calendar"
  max_upload_mb: 40
  # Uploads are downscaled to this on the long edge and saved as JPEG. A phone
  # photo is ~4000px; a wall panel is 1080-1440px, so this saves a lot of work
  # on every slideshow tick.
  resize_long_edge: 2560

# Phase 2: pulling appointments out of email and forwarded texts.
# Read docs/phase2-appointment-import.md before enabling. Everything imported
# lands UNCONFIRMED -- dashed and amber on the panel until someone taps Confirm.
importer:
  enabled: false
  # Keep true for the first week: messages are parsed and logged to
  # data/import-log.jsonl but nothing is written to the calendar. Read the log,
  # check the dates it extracted, then set false.
  dry_run: true
  # Extractions below this confidence are logged and dropped.
  min_confidence: 0.5
  calendar: "From email"
  color: "#7a3fa0"
  # Extraction uses the Claude API (pip install anthropic). The key can also
  # come from the ANTHROPIC_API_KEY environment variable.
  model: claude-opus-5
  api_key: ""
  # Optional: poll one Gmail label over IMAP. Create a Gmail filter that
  # applies the label to likely appointment mail first -- never point this at
  # your whole inbox (cost, and far more of your mail leaves the house than
  # the task needs). Use an app password: https://myaccount.google.com/apppasswords
  gmail:
    host: imap.gmail.com
    username: ""
    app_password: ""
    folder: "Appointments"
    poll_minutes: 10

presence:
  # none   - always show the calendar, no presence handling at all
  # http   - something else POSTs /api/presence (Home Assistant, a sensor script)
  # gpio   - PIR/mmWave sensor on Raspberry Pi GPIO (needs gpiozero)
  # serial - LD2410 mmWave over USB serial, works on Pi and x86 alike
  backend: http
  # Presence is "held" this long after the last detection, so a sensor that
  # pulses rather than latching doesn't make the display flicker between modes.
  hold_seconds: 20
  gpio:
    pin: 17
  serial:
    port: /dev/ttyUSB0
    baud: 256000

data_dir: data
